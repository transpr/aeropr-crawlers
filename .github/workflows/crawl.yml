name: Crawl press releases

on:
  schedule:
    - cron: "*/5 * * * *"   # direct layer: newsroom scrape + RSS
    - cron: "7 * * * *"     # discovery layer: Google News RSS (hourly)
  workflow_dispatch: {}

concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install headless Chromium (anti-bot fallback)
        run: npx playwright install --with-deps chromium

      - name: Run crawlers
        id: crawl
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          LAYER=${{ (github.event.schedule == '7 * * * *') && 'discovery' || 'direct' }}
          echo "Running crawl layer: $LAYER"
          npm run crawl -- --layer=$LAYER 2>&1 | tee crawl.log
        continue-on-error: true

      - name: Report source failures (auto issue)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q "FAILED_SOURCES" crawl.log; then
            gh label create "crawler-broken" --color B60205 2>/dev/null || true
            BODY=$(grep -A 20 "FAILED_SOURCES" crawl.log)
            gh issue create \
              --title "Crawler failure: source structure may have changed" \
              --label "crawler-broken" \
              --body "The crawl run on $(date -u) reported failures:

          ```
          ${BODY}
          ```

          Check if the newsroom HTML changed (or is blocking us) and update the source." \
              || true
          fi
